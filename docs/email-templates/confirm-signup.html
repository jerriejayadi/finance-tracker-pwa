<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email — FinTrack</title>
</head>
<body style="margin:0; padding:0; background-color:#1a1a1a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1a1a1a; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px; background-color:#242424; border-radius:12px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding:32px 32px 24px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:32px; height:32px; background-color:#d4a844; border-radius:6px; text-align:center; vertical-align:middle; font-size:18px; font-weight:700; color:#2a1f0a; font-family:monospace;">F</td>
                  <td style="padding-left:10px; font-size:14px; font-weight:600; color:#f5f5f5; letter-spacing:-0.01em;">FinTrack</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:0 32px;">
              <h1 style="margin:0 0 8px 0; font-size:22px; font-weight:600; color:#f5f5f5; letter-spacing:-0.02em;">Verify your email</h1>
              <p style="margin:0 0 28px 0; font-size:14px; line-height:1.6; color:#a0a0a0;">Enter this code to complete your registration. It expires in 10 minutes.</p>

              <!-- OTP Code -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding:20px 0; background-color:#1a1a1a; border-radius:8px; border:1px solid #333333;">
                    <span style="font-size:32px; font-weight:700; letter-spacing:0.3em; color:#d4a844; font-family:monospace;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <p style="margin:24px 0 0 0; font-size:13px; line-height:1.5; color:#707070;">Or verify directly using this link:</p>
              <p style="margin:8px 0 0 0;"><a href="{{ .ConfirmationURL }}" style="font-size:13px; color:#d4a844; text-decoration:underline;">Confirm my email</a></p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:32px; border-top:1px solid #2e2e2e; margin-top:32px;">
              <p style="margin:0; font-size:12px; line-height:1.5; color:#555555;">If you didn't create a FinTrack account, ignore this email.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
